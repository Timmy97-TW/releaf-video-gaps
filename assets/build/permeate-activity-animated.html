<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Permeate activity — animated</title>
<style>
  html,body{margin:0;padding:0;background:#0b0d10;overflow:hidden}
  #stage{width:1920px;height:1080px;transform-origin:top left;position:absolute;top:0;left:0}
  body.fit{overflow:hidden}
  #ui{position:fixed;right:14px;bottom:14px;z-index:9;display:flex;gap:8px;
    font:500 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
  #ui button{background:rgba(255,255,255,.1);color:#f5f5f7;border:1px solid rgba(255,255,255,.2);
    border-radius:980px;padding:7px 15px;cursor:pointer}
  #ui button:hover{background:rgba(255,255,255,.18)}
  body.record #ui{display:none}

  /* --- animation --- */
  .fadeIn{opacity:0;animation:fi .5s ease forwards}
  @keyframes fi{to{opacity:1}}
  #gTitle{animation-delay:.1s}
  #gSub{animation-delay:.45s}
  #gAxes{animation-delay:.2s}
  #gLowZone{animation-delay:1.1s}
  #gLowNote{animation-delay:1.4s}
  #gBand{animation-delay:3.0s}
  #gBandLabel{animation-delay:3.4s}
  #gFoot{animation-delay:4.2s}

  /* line draw */
  #rise{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:draw 1.5s cubic-bezier(.65,0,.35,1) 1.5s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  #plateau{stroke-dasharray:2 16;opacity:0;animation:fi .6s ease 3.2s forwards}

  /* dots */
  #d6,#d12{opacity:0;animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards}
  #d6{animation-delay:1.55s} #d12{animation-delay:1.75s}
  @keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
  #d6,#d12{transform-box:fill-box;transform-origin:center}

  #dot18{opacity:0;transform-box:fill-box;transform-origin:center;
    animation:pop18 .55s cubic-bezier(.34,1.56,.64,1) 2.85s forwards}
  @keyframes pop18{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
  #ring18{opacity:0;transform-box:fill-box;transform-origin:center;
    animation:ring 1.1s ease-out 2.95s}
  @keyframes ring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
  #drop18{opacity:0;animation:fi .5s ease 3.05s forwards}
  #lbl18{opacity:0;animation:rise .6s cubic-bezier(.22,1,.36,1) 3.0s forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  #lbl18{transform-box:fill-box}
</style>
</head>
<body class="fit">
<div id="stage">
<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"
     font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fd38d" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#5fd38d" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="riseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fd38d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5fd38d" stop-opacity="1"/>
    </linearGradient>
    <filter id="dotGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0b0d10"/>

  <g id="gTitle" class="fadeIn">
    <text x="190" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">ACC deaminase is catalytically active in the permeate</text>
  </g>
  <g id="gSub" class="fadeIn">
    <text x="190" y="135" fill="#9aa0a8" font-size="25">Specific activity on the shell side of the membrane — a compartment with no cells in it</text>
  </g>

  <g id="gAxes" class="fadeIn">
    <g stroke="#232830" stroke-width="1.5">
      <line x1="190" y1="190" x2="1800" y2="190"/>
      <line x1="190" y1="328" x2="1800" y2="328"/>
      <line x1="190" y1="466" x2="1800" y2="466"/>
      <line x1="190" y1="604" x2="1800" y2="604"/>
      <line x1="190" y1="742" x2="1800" y2="742"/>
    </g>
    <line x1="190" y1="880" x2="1800" y2="880" stroke="#4a515b" stroke-width="2.5"/>
    <line x1="190" y1="190" x2="190" y2="880" stroke="#4a515b" stroke-width="2.5"/>
    <g fill="#9aa0a8" font-size="24" text-anchor="end">
      <text x="165" y="889">0</text><text x="165" y="751">2</text><text x="165" y="613">4</text>
      <text x="165" y="475">6</text><text x="165" y="337">8</text><text x="165" y="199">10</text>
    </g>
    <text transform="translate(78,535) rotate(-90)" fill="#f5f5f7" font-size="27" font-weight="500" text-anchor="middle">Specific activity (U mg⁻¹)</text>
    <g fill="#9aa0a8" font-size="24" text-anchor="middle">
      <text x="190" y="925">0</text><text x="317" y="925">6</text><text x="444" y="925">12</text>
      <text x="571" y="925">18</text><text x="698" y="925">24</text><text x="825" y="925">30</text>
      <text x="952" y="925">36</text><text x="1207" y="925">48</text><text x="1715" y="925">72</text>
    </g>
    <text x="995" y="972" fill="#f5f5f7" font-size="27" font-weight="500" text-anchor="middle">Time in the reactor (h)</text>
  </g>

  <g id="gBand" class="fadeIn">
    <rect x="571" y="300" width="1144" height="235" fill="url(#bandGrad)"/>
    <line x1="571" y1="300" x2="1715" y2="300" stroke="#5fd38d" stroke-width="2" stroke-dasharray="9 7" opacity="0.62"/>
    <line x1="571" y1="535" x2="1715" y2="535" stroke="#5fd38d" stroke-width="2" stroke-dasharray="9 7" opacity="0.62"/>
  </g>
  <g id="gBandLabel" class="fadeIn">
    <text x="1690" y="368" fill="#5fd38d" font-size="29" font-weight="600" text-anchor="end">holds 5 – 8.4 U mg⁻¹ through 72 h</text>
  </g>

  <g id="gLowZone" class="fadeIn">
    <rect x="290" y="811" width="181" height="69" fill="#ff9f45" opacity="0.14"/>
    <line x1="290" y1="811" x2="471" y2="811" stroke="#ff9f45" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>
    <text x="380" y="800" fill="#ff9f45" font-size="25" font-weight="600" text-anchor="middle">&lt; 1 U mg⁻¹</text>
  </g>
  <g id="gLowNote" class="fadeIn">
    <text x="317" y="700" fill="#9aa0a8" font-size="23" text-anchor="middle">marginal</text>
    <text x="317" y="730" fill="#9aa0a8" font-size="23" text-anchor="middle">at 6 and 12 h</text>
  </g>

  <path id="plateau" d="M 571 445 L 1715 445" fill="none" stroke="#5fd38d" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path id="rise" d="M 317 849 L 444 855 L 571 445" fill="none" stroke="url(#riseGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <circle id="d6"  cx="317" cy="849" r="9" fill="#0b0d10" stroke="#ff9f45" stroke-width="4"/>
  <circle id="d12" cx="444" cy="855" r="9" fill="#0b0d10" stroke="#ff9f45" stroke-width="4"/>

  <line id="drop18" x1="571" y1="461" x2="571" y2="880" stroke="#5fd38d" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
  <circle id="ring18" cx="571" cy="445" r="16" fill="none" stroke="#5fd38d" stroke-width="3"/>
  <circle id="dot18" cx="571" cy="445" r="16" fill="#5fd38d" filter="url(#dotGlow)"/>
  <g id="lbl18">
    <text x="612" y="432" fill="#f5f5f7" font-size="56" font-weight="650" letter-spacing="-1">6.3 U mg⁻¹</text>
    <text x="614" y="470" fill="#9aa0a8" font-size="26">at 18 hours</text>
  </g>

  <g id="gFoot" class="fadeIn">
    <line x1="190" y1="1000" x2="1800" y2="1000" stroke="#232830" stroke-width="1.5"/>
    <text x="190" y="1034" fill="#9aa0a8" font-size="21">Cell-free permeate, fourth integrated cycle. One sample per time point. 1 U = 1 µmol α-ketobutyrate per hour (30 °C, 12 h incubation).</text>
    <text x="190" y="1062" fill="#6e747c" font-size="21">Because the compartment contains no cells, this activity cannot be host background.</text>
  </g>
</svg>
</div>

<div id="ui">
  <button id="replay">Replay</button>
  <button id="rec">Record size (1:1)</button>
</div>

<script>
(function(){
  var rise=document.getElementById('rise');
  var len=rise.getTotalLength();
  rise.style.setProperty('--len', len);

  var stage=document.getElementById('stage');
  var recording = new URLSearchParams(location.search).has('record');

  function fit(){
    if(recording){ stage.style.transform='none'; return; }
    var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform='scale('+s+')';
    document.body.style.width=(1920*s)+'px';
    document.body.style.height=(1080*s)+'px';
  }
  fit(); window.addEventListener('resize',fit);

  if(recording) document.body.classList.add('record');

  document.getElementById('replay').onclick=function(){
    var c=stage.cloneNode(true);
    stage.parentNode.replaceChild(c,stage);
    stage=c;
    var r=document.getElementById('rise');
    r.style.setProperty('--len', r.getTotalLength());
    fit();
  };
  document.getElementById('rec').onclick=function(){
    location.search = recording ? '' : '?record=1';
  };
})();
</script>
</body>
</html>

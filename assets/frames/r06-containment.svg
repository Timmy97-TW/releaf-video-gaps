<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">The membrane held the cells back</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Both sides of the hollow fibre plated on LB agar, 24 h at 37 °C</text><rect x="140" y="215" width="770" height="700" rx="18" fill="#12161b" stroke="#232830" stroke-width="2"/><text x="188" y="290" fill="#ff9f45" font-size="26" font-weight="650" letter-spacing="1.2">INSIDE THE LOOP</text><text x="188" y="470" fill="#f5f5f7" font-size="140" font-weight="700" letter-spacing="-4">growth</text><text x="188" y="524" fill="#9aa0a8" font-size="30">lumen side</text><text x="188" y="610" fill="#9aa0a8" font-size="26">Cells recovered, as expected.</text><text x="188" y="654" fill="#9aa0a8" font-size="26">Pore 0.2 µm nominal.</text><text x="188" y="698" fill="#9aa0a8" font-size="26">Our cells are 0.8 – 2.0 µm wide,</text><text x="188" y="742" fill="#9aa0a8" font-size="26">up to 3.0 µm long.</text><rect x="1010" y="215" width="770" height="700" rx="18" fill="#12161b" stroke="#232830" stroke-width="2"/><text x="1058" y="290" fill="#5fd38d" font-size="26" font-weight="650" letter-spacing="1.2">OUTPUT SIDE</text><text x="1058" y="470" fill="#f5f5f7" font-size="140" font-weight="700" letter-spacing="-4">none</text><text x="1058" y="524" fill="#9aa0a8" font-size="30">shell permeate</text><text x="1058" y="610" fill="#9aa0a8" font-size="26">No colonies recovered.</text><text x="1058" y="654" fill="#9aa0a8" font-size="26">2 mL plated.</text><text x="1058" y="698" fill="#9aa0a8" font-size="26">Two plates in total, no replicates,</text><text x="1058" y="742" fill="#9aa0a8" font-size="26">no log reduction measured.</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">This is preliminary evidence of retention, not a validated containment efficiency.</text><text x="140" y="1056" fill="#6e747c" font-size="21">Never say “contained” or “biosafe” on camera.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">Green light moves the activity, not the amount</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">CcaS/CcaR cultures sampled at 13 h and 16 h under green or red light</text><rect x="140" y="215" width="770" height="700" rx="18" fill="#12161b" stroke="#232830" stroke-width="2"/><text x="188" y="290" fill="#5fd38d" font-size="26" font-weight="650" letter-spacing="1.2">AT 13 HOURS</text><text x="188" y="470" fill="#f5f5f7" font-size="140" font-weight="700" letter-spacing="-4">14×</text><text x="188" y="524" fill="#9aa0a8" font-size="30">more activity under green than red</text><text x="188" y="610" fill="#9aa0a8" font-size="26">green  0.1249 mM α-KB</text><text x="188" y="654" fill="#9aa0a8" font-size="26">red     0.0089 mM α-KB</text><text x="188" y="698" fill="#9aa0a8" font-size="26">Protein concentration over the same</text><text x="188" y="742" fill="#9aa0a8" font-size="26">window: 12 – 13 µg/mL under both.</text><rect x="1010" y="215" width="770" height="700" rx="18" fill="#12161b" stroke="#232830" stroke-width="2"/><text x="1058" y="290" fill="#c7372a" font-size="26" font-weight="650" letter-spacing="1.2">AT 16 HOURS</text><text x="1058" y="470" fill="#f5f5f7" font-size="140" font-weight="700" letter-spacing="-4">it inverts</text><text x="1058" y="524" fill="#9aa0a8" font-size="30">red overtakes green</text><text x="1058" y="610" fill="#9aa0a8" font-size="26">red      0.0923 mM α-KB</text><text x="1058" y="654" fill="#9aa0a8" font-size="26">green  0.0130 mM α-KB</text><text x="1058" y="698" fill="#9aa0a8" font-size="26">Single plate, technical replicates,</text><text x="1058" y="742" fill="#9aa0a8" font-size="26">no statistical test.</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">Concentration does not change between colours; activity does, but not yet predictably.</text><text x="140" y="1056" fill="#6e747c" font-size="21">Our own wiki says it plainly: the switch has not been demonstrated to work. Say that out loud.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">Applied too late, the protectant left plants worse off</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Soil Arabidopsis, ACC deaminase at three timings, 37 °C for five days, two trials</text><text x="400" y="290.32" fill="#f5f5f7" font-size="30" text-anchor="end">heat control</text><rect x="430" y="250" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="250" width="747.5" height="56" rx="6" fill="#4a515b"/><text x="1199.5" y="290.32" fill="#f5f5f7" font-size="32" font-weight="650">0.195</text><text x="1321.5" y="290.32" fill="#9aa0a8" font-size="24">trial 1</text><text x="400" y="398.32" fill="#f5f5f7" font-size="30" text-anchor="end">pre-treatment</text><rect x="430" y="358" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="358" width="644.0" height="56" rx="6" fill="#5fd38d"/><text x="1096.0" y="398.32" fill="#f5f5f7" font-size="32" font-weight="650">0.168</text><text x="1218.0" y="398.32" fill="#9aa0a8" font-size="24">held the most chlorophyll in both trials</text><text x="400" y="506.32" fill="#f5f5f7" font-size="30" text-anchor="end">co-treatment</text><rect x="430" y="466" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="466" width="874.0" height="56" rx="6" fill="#3f8f63"/><text x="1326.0" y="506.32" fill="#f5f5f7" font-size="32" font-weight="650">0.228</text><text x="1448.0" y="506.32" fill="#9aa0a8" font-size="24">best weight in trial 1 only</text><text x="400" y="614.32" fill="#f5f5f7" font-size="30" text-anchor="end">post-treatment</text><rect x="430" y="574" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="574" width="394.8" height="56" rx="6" fill="#c7372a"/><text x="846.8" y="614.32" fill="#f5f5f7" font-size="32" font-weight="650">0.103</text><text x="968.8" y="614.32" fill="#9aa0a8" font-size="24">below the untreated control</text><text x="430" y="698" fill="#9aa0a8" font-size="25">fresh weight (g), trial 1</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">Trial 2 repeats the direction: post-treatment 0.052 g against a 0.225 g heat control, and it bolted the most.</text><text x="140" y="1056" fill="#6e747c" font-size="21">One pot per condition. This is a direction, not a dose — and it is the argument for forecasting the stress.</text>
</svg>

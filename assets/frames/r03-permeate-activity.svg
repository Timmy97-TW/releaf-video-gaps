<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">ACC deaminase is catalytically active in the permeate</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Specific activity on the shell side of the membrane — a compartment with no cells in it</text><line x1="240" y1="860.0" x2="1780" y2="860.0" stroke="#232830" stroke-width="1.5"/><text x="216" y="869.0" fill="#9aa0a8" font-size="24" text-anchor="end">0</text><line x1="240" y1="731.0" x2="1780" y2="731.0" stroke="#232830" stroke-width="1.5"/><text x="216" y="740.0" fill="#9aa0a8" font-size="24" text-anchor="end">2</text><line x1="240" y1="602.0" x2="1780" y2="602.0" stroke="#232830" stroke-width="1.5"/><text x="216" y="611.0" fill="#9aa0a8" font-size="24" text-anchor="end">4</text><line x1="240" y1="473.0" x2="1780" y2="473.0" stroke="#232830" stroke-width="1.5"/><text x="216" y="482.0" fill="#9aa0a8" font-size="24" text-anchor="end">6</text><line x1="240" y1="344.0" x2="1780" y2="344.0" stroke="#232830" stroke-width="1.5"/><text x="216" y="353.0" fill="#9aa0a8" font-size="24" text-anchor="end">8</text><line x1="240" y1="215.0" x2="1780" y2="215.0" stroke="#232830" stroke-width="1.5"/><text x="216" y="224.0" fill="#9aa0a8" font-size="24" text-anchor="end">10</text><line x1="240" y1="860" x2="1780" y2="860" stroke="#4a515b" stroke-width="2.5"/><line x1="240" y1="215" x2="240" y2="860" stroke="#4a515b" stroke-width="2.5"/><text x="240.0" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">0</text><text x="361.6" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">6</text><text x="483.2" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">12</text><text x="604.7" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">18</text><text x="726.3" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">24</text><text x="847.9" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">30</text><text x="969.5" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">36</text><text x="1212.6" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">48</text><text x="1698.9" y="902" fill="#9aa0a8" font-size="24" text-anchor="middle">72</text><text x="1010.0" y="952" fill="#f5f5f7" font-size="27" font-weight="500" text-anchor="middle">Time in the reactor (h)</text><text transform="translate(112,537.5) rotate(-90)" fill="#f5f5f7" font-size="27" font-weight="500" text-anchor="middle">Specific activity (U mg⁻¹)</text><rect x="604.7" y="318.2" width="1094.2" height="219.3" fill="#5fd38d" opacity="0.16"/><text x="1684.9" y="360.2" fill="#5fd38d" font-size="28" font-weight="600" text-anchor="end">holds 5 – 8.4 U mg⁻¹ through 72 h</text><rect x="341.3" y="795.5" width="162.1" height="64.5" fill="#ff9f45" opacity="0.16"/><text x="489.4" y="837.5" fill="#ff9f45" font-size="28" font-weight="600" text-anchor="end">&lt; 1 U mg⁻¹</text><path d="M 361.6 814.9 L 483.2 827.8 L 604.7 453.6" fill="none" stroke="#5fd38d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="361.6" cy="814.9" r="9" fill="#0b0d10" stroke="#5fd38d" stroke-width="4"/><circle cx="483.2" cy="827.8" r="9" fill="#0b0d10" stroke="#5fd38d" stroke-width="4"/><circle cx="604.7" cy="453.6" r="9" fill="#0b0d10" stroke="#5fd38d" stroke-width="4"/><circle cx="604.7" cy="453.6" r="15" fill="#5fd38d"/><text x="638.7" y="439.6" fill="#f5f5f7" font-size="46" font-weight="650" letter-spacing="-1">6.3 U mg⁻¹</text><text x="640.7" y="475.6" fill="#9aa0a8" font-size="25">at 18 hours</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">Cell-free permeate, fourth integrated cycle. One sample per time point. 1 U = 1 µmol α-ketobutyrate per hour (30 °C, 12 h incubation).</text><text x="140" y="1056" fill="#6e747c" font-size="21">Because the compartment contains no cells, this activity cannot be host background.</text>
</svg>

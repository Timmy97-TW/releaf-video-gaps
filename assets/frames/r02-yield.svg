<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">All three protectants are secreted</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Competitive ELISA on culture supernatant, B. subtilis WB800</text><text x="400" y="290.32" fill="#f5f5f7" font-size="30" text-anchor="end">ACC deaminase</text><rect x="430" y="250" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="250" width="836.4" height="56" rx="6" fill="#5fd38d"/><text x="1288.4" y="290.32" fill="#f5f5f7" font-size="32" font-weight="650">16</text><text x="1350.4" y="290.32" fill="#9aa0a8" font-size="24">about three times the others</text><text x="400" y="398.32" fill="#f5f5f7" font-size="30" text-anchor="end">LEA14</text><rect x="430" y="358" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="358" width="313.6" height="56" rx="6" fill="#3f8f63"/><text x="765.6" y="398.32" fill="#f5f5f7" font-size="32" font-weight="650">6</text><text x="400" y="506.32" fill="#f5f5f7" font-size="30" text-anchor="end">BoPEP4</text><rect x="430" y="466" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="466" width="313.6" height="56" rx="6" fill="#3f8f63"/><text x="765.6" y="506.32" fill="#f5f5f7" font-size="32" font-weight="650">6</text><text x="430" y="590" fill="#9aa0a8" font-size="25">µg/mL in the supernatant</text><text x="1780" y="590" fill="#ff9f45" font-size="25" text-anchor="end">approximate values only</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">Single wells. ACC deaminase read below the lowest standard, so its concentration is an extrapolation, not a quantity.</text><text x="140" y="1056" fill="#6e747c" font-size="21">Say “about 16” and “about 6”. The plate assay does not clear its negative control, so it shows secretion, not expression level.</text>
</svg>

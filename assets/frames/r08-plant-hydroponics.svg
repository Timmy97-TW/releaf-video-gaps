<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">The only plant run with a strain-matched control</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Hydroponic Arabidopsis under 100 mM NaCl, BoPEP4 supernatant at 1/40</text><rect x="140" y="215" width="770" height="700" rx="18" fill="#12161b" stroke="#232830" stroke-width="2"/><text x="188" y="290" fill="#c7372a" font-size="26" font-weight="650" letter-spacing="1.2">CONTROL</text><text x="188" y="470" fill="#f5f5f7" font-size="140" font-weight="700" letter-spacing="-4">bleached</text><text x="188" y="524" fill="#9aa0a8" font-size="30">WB800 supernatant, no protectant</text><text x="188" y="610" fill="#9aa0a8" font-size="26">Same Bacillus culture.</text><text x="188" y="654" fill="#9aa0a8" font-size="26">Same dilution.</text><text x="188" y="698" fill="#9aa0a8" font-size="26">The protectant is the only</text><text x="188" y="742" fill="#9aa0a8" font-size="26">difference between these two.</text><rect x="1010" y="215" width="770" height="700" rx="18" fill="#12161b" stroke="#232830" stroke-width="2"/><text x="1058" y="290" fill="#5fd38d" font-size="26" font-weight="650" letter-spacing="1.2">1/40 BOPEP4</text><text x="1058" y="470" fill="#f5f5f7" font-size="140" font-weight="700" letter-spacing="-4">green</text><text x="1058" y="524" fill="#9aa0a8" font-size="30">near unsalted fresh weight</text><text x="1058" y="610" fill="#9aa0a8" font-size="26">The only salted group that stayed</text><text x="1058" y="654" fill="#9aa0a8" font-size="26">near the unsalted range.</text><text x="1058" y="698" fill="#9aa0a8" font-size="26">One box per condition.</text><text x="1058" y="742" fill="#9aa0a8" font-size="26">A single run.</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">This is the project's proof of concept, and it is a proof of concept: one run, one box per condition, no technical replication.</text><text x="140" y="1056" fill="#6e747c" font-size="21">The ordering among 1/60, 1/80 and 1/100 is not supported by this run.</text>
</svg>

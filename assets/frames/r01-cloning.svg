<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">Every transformant we screened carried the construct</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Colony PCR of WB800 transformants, Pveg-EEBD-RBS0-SamyQ:BoPep4-2.1-B0015</text><text x="140" y="520" fill="#5fd38d" font-size="250" font-weight="700" letter-spacing="-8">23</text><text x="420" y="520" fill="#9aa0a8" font-size="58" font-weight="500">of 23</text><text x="140" y="600" fill="#f5f5f7" font-size="36" font-weight="500">lanes positive — the band is in every one</text><text x="1180" y="300" fill="#9aa0a8" font-size="26">9 / 9  Level 2 junctions correct</text><text x="1180" y="346" fill="#9aa0a8" font-size="26">3  independent clones</text><text x="1180" y="392" fill="#9aa0a8" font-size="26">10,293 bp  EcoRI linearised</text><text x="1180" y="438" fill="#9aa0a8" font-size="26">7,543 bp  EcoRI + BtsI</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">Level 2 assembly verified at nine of nine junctions across three independent clones; diagnostic digest at 10,293 bp and 7,543 bp.</text><text x="140" y="1056" fill="#6e747c" font-size="21">No Level 2 construct has been sequenced end to end.</text>
</svg>

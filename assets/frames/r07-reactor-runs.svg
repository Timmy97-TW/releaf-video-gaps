<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<rect width="1920" height="1080" fill="#0b0d10"/>
<text x="140" y="92" fill="#f5f5f7" font-size="46" font-weight="600" letter-spacing="-0.8">The reactor runs for days and senses while it runs</text>
<text x="140" y="134" fill="#9aa0a8" font-size="25">Integrated cycles, inline photometer and pressure block logging continuously</text><text x="400" y="290.32" fill="#f5f5f7" font-size="30" text-anchor="end">longest run (h)</text><rect x="430" y="250" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="250" width="10.3" height="56" rx="6" fill="#5fd38d"/><text x="462.3" y="290.32" fill="#f5f5f7" font-size="32" font-weight="650">116</text><text x="544.3" y="290.32" fill="#9aa0a8" font-size="24">single continuous cycle</text><text x="400" y="398.32" fill="#f5f5f7" font-size="30" text-anchor="end">rows logged</text><rect x="430" y="358" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="358" width="1016.7" height="56" rx="6" fill="#3f8f63"/><text x="1468.7" y="398.32" fill="#f5f5f7" font-size="32" font-weight="650">11493</text><text x="1590.7" y="398.32" fill="#9aa0a8" font-size="24">of 12,259 attempted</text><text x="400" y="506.32" fill="#f5f5f7" font-size="30" text-anchor="end">automatic base doses</text><rect x="430" y="466" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="466" width="4.7" height="56" rx="6" fill="#ff9f45"/><text x="456.7" y="506.32" fill="#f5f5f7" font-size="32" font-weight="650">53</text><text x="518.7" y="506.32" fill="#9aa0a8" font-size="24">pH held 6.4 – 7.9, overnight</text><text x="400" y="614.32" fill="#f5f5f7" font-size="30" text-anchor="end">reference beam (h)</text><rect x="430" y="574" width="1150" height="56" rx="6" fill="#14181d"/><rect x="430" y="574" width="17.2" height="56" rx="6" fill="#3f8f63"/><text x="469.2" y="614.32" fill="#f5f5f7" font-size="32" font-weight="650">194</text><text x="551.2" y="614.32" fill="#9aa0a8" font-size="24">separates a failing sensor from a changing culture</text><text x="430" y="698" fill="#9aa0a8" font-size="25">values as labelled</text><line x1="140" y1="990" x2="1780" y2="990" stroke="#232830" stroke-width="1.5"/><text x="140" y="1026" fill="#9aa0a8" font-size="21">The pH loop is a real sensor-to-actuator loop, but it ran one night only: 1 M KOH corroded four valves in succession.</text><text x="140" y="1056" fill="#6e747c" font-size="21">A ten-hour gap in the 116 h run is a host-computer update, and the second rise at 47 h is loss of selection, not biology.</text>
</svg>

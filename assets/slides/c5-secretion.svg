<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ar-1d7a46" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d7a46"/></marker><marker id="ar-c7372a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c7372a"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="90" y="80" fill="#1d1d1f" font-size="44" font-weight="600" letter-spacing="-0.8">All three protectants are secreted into the medium</text><text x="90" y="120" fill="#6e6e73" font-size="24">Competitive ELISA on WB800 supernatant</text><rect x="90" y="200" width="620" height="700" rx="12" fill="#fafafb"/><image href="data:image/png;base64," x="144.4" y="200.0" width="511.1" height="700.0" preserveAspectRatio="xMidYMid meet"/><rect x="90" y="200" width="620" height="700" rx="12" fill="none" stroke="#d2d2d7" stroke-width="2"/><rect x="90" y="200" width="268" height="34" rx="12" fill="#1d7a46"/><text x="103" y="224" fill="#fff" font-size="18" font-weight="700" letter-spacing="0.6">ACCD · LEA14 · BoPEP4</text><text x="760" y="330" fill="#1d1d1f" font-size="32" font-weight="500" text-anchor="start">ACC deaminase reaches about</text><text x="760" y="382" fill="#1d7a46" font-size="86" font-weight="700" text-anchor="start">16 µg/mL</text><text x="760" y="444" fill="#1d1d1f" font-size="32" font-weight="500" text-anchor="start">against about 6 for LEA14 and BoPEP4 —</text><text x="760" y="486" fill="#1d1d1f" font-size="32" font-weight="500" text-anchor="start">roughly three times as much.</text><rect x="760" y="548" width="1070" height="200" rx="14" fill="#1a1013" stroke="#c7372a" stroke-width="2"/><text x="792" y="592" fill="#c7372a" font-size="21" font-weight="700" text-anchor="start">WHAT THIS FIGURE CANNOT SAY</text><text x="792" y="636" fill="#1d1d1f" font-size="23" font-weight="400" text-anchor="start">The untransformed WB800 control reads 5.452 and 4.562 µg/mL — the same range</text><text x="792" y="668" fill="#1d1d1f" font-size="23" font-weight="400" text-anchor="start">as four of the six constructs. Our own Measurement page concludes the assay is reading</text><text x="792" y="700" fill="#1d1d1f" font-size="23" font-weight="400" text-anchor="start">something other than recombinant protein, so no difference here proves expression.</text><text x="792" y="732" fill="#9a6400" font-size="23" font-weight="600" text-anchor="start">Use this slide for “it is secreted”, never for “this much was expressed”.</text><line x1="90" y1="988" x2="1830" y2="988" stroke="#d2d2d7" stroke-width="1.5"/><text x="90" y="1024" fill="#6e6e73" font-size="21">Say “about 16” and “about 6” — no decimals. ACC deaminase read below the lowest standard, so the number is an extrapolation.</text><text x="90" y="1054" fill="#8a8a8e" font-size="21">The proof that the protein is functional is the permeate slide, not this one.</text>
</svg>
